<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="w" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.16" numOctaves="5" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0.42 0 0 0 0.34
                0.24 0 0 0 0.20
                0.11 0 0 0 0.09
                0 0 0 0 1"/>
    </filter>
    <radialGradient id="v" cx="50%" cy="42%" r="78%">
      <stop offset="62%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#33190a" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.22" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" filter="url(#w)"/>
  <!-- 板面色差 -->
  <rect x="0" width="100" height="400" fill="#ffffff" opacity="0.035"/>
  <rect x="200" width="100" height="400" fill="#000000" opacity="0.05"/>
  <!-- 板缝（暗缝 + 高光） -->
  <g stroke="#2e1508" stroke-opacity="0.30" stroke-width="2">
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1">
    <line x1="102" y1="0" x2="102" y2="400"/>
    <line x1="202" y1="0" x2="202" y2="400"/>
    <line x1="302" y1="0" x2="302" y2="400"/>
  </g>
  <rect width="400" height="400" fill="url(#v)"/>
  <rect width="400" height="400" fill="url(#shine)"/>
</svg>
